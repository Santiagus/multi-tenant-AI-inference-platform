server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Inference / worker drains can run for many minutes (HF download + GPU forward).
    # Default nginx proxy_read_timeout is 60s and surfaces as HTML 504 Gateway Time-out.
    location /v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        # Disable buffering so progress-oriented long POSTs are not held back.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /healthz {
        proxy_pass http://api:3000;
        proxy_read_timeout 30s;
    }

    location /readyz {
        proxy_pass http://api:3000;
        proxy_read_timeout 30s;
    }

    location /docs {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /documentation {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
