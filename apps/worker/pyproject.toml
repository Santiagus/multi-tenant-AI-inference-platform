[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-inference-worker"
version = "0.1.0"
description = "Multi-tenant AI inference worker with PyTorch GPU and CPU fallback execution"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "transformers>=4.44.0",
    "diffusers>=0.31.0",
    "accelerate>=0.33.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "ftfy>=6.1.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
    "pillow>=10.0.0",
]

[tool.setuptools]
py-modules = []

[tool.uv]
dev-dependencies = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "ruff>=0.5.0",
]

