[project]
name = "platform-inference-worker"
version = "0.1.0"
description = "Multi-tenant AI inference worker with PyTorch GPU and CPU fallback execution"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
]

