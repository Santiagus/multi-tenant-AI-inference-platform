apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Drop All Linux Capabilities
    policies.kyverno.io/category: Multi-Tenant Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must drop ALL POSIX capabilities and disallow privilege escalation to prevent container breakout.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - control-plane
                - inference-workers
      validate:
        message: "Containers must drop ALL capabilities under securityContext.capabilities.drop: ['ALL']."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL

