apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-execution
  annotations:
    policies.kyverno.io/title: Disallow Root User Execution
    policies.kyverno.io/category: Multi-Tenant Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must run as non-root users (UID >= 1000) to enforce defense-in-depth tenant boundary isolation.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - control-plane
                - inference-workers
      validate:
        message: "Running containers as root is forbidden. Set securityContext.runAsNonRoot: true and runAsUser >= 1000."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false

