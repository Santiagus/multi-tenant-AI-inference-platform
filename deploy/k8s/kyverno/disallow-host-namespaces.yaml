apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces and Host Ports
    policies.kyverno.io/category: Multi-Tenant Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must not share host PID, IPC, or network namespaces to prevent host-level tenant snooping.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - control-plane
                - inference-workers
      validate:
        message: "Sharing host PID, IPC, or network namespaces is forbidden."
        pattern:
          spec:
            =(hostPID): "false"
            =(hostIPC): "false"
            =(hostNetwork): "false"

