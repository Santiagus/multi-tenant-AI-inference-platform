# Local Kind / k3d CPU-First Kubernetes Profile
global:
  environment: local-kind
  tenantDefault: tenant-default

api:
  replicaCount: 2
  service:
    type: NodePort
    port: 3000
    nodePort: 30080
  env:
    databaseUrl: "postgresql://postgres:postgres@172.25.0.1:5432/platform"
    s3Endpoint: "http://172.25.0.1:9000"
    sqsEndpoint: "http://172.25.0.1:9324"
    sqsQueueUrl: "http://172.25.0.1:9324/000000000000/inference-jobs"
    sqsDlqUrl: "http://172.25.0.1:9324/000000000000/inference-jobs-dlq"

worker:
  replicaCount: 0
  executionMode: cpu-fallback
  runtimeClassName: ""
  nodeSelector:
    workload-role: api-and-cpu-worker
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1500m"
      memory: "1Gi"
      nvidiaGpu: 0

keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 6
  targetQueueDepthPerReplica: 4
  activationQueueDepthThreshold: 1

kueue:
  enabled: true
  quotas:
    nominalCpu: "8"
    borrowingLimitCpu: "4"
    nominalMemory: "16Gi"
    borrowingLimitMemory: "8Gi"
    nominalGpu: 1
    borrowingLimitGpu: 1

kyverno:
  enabled: true
  validationFailureAction: Enforce

gpu:
  enabled: false
  dcgmExporter:
    enabled: false

