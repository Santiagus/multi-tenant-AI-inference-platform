apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Values.global.namespaces.controlPlane }}
  labels:
    app.kubernetes.io/name: {{ .Values.api.name }}
    app.kubernetes.io/component: control-plane-api
    app.kubernetes.io/part-of: multi-tenant-ai-inference-platform
    platform.ai/tenant: {{ .Values.global.tenantDefault }}
    platform.ai/environment: {{ .Values.global.environment | quote }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.api.name }}
      app.kubernetes.io/component: control-plane-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.api.name }}
        app.kubernetes.io/component: control-plane-api
        app.kubernetes.io/part-of: multi-tenant-ai-inference-platform
        platform.ai/tenant: {{ .Values.global.tenantDefault }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.service.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.api.env.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: {{ .Values.api.env.logLevel | quote }}
            - name: WORKER_ENABLED
              value: "false"
            - name: DEFAULT_TENANT_ID
              value: {{ .Values.global.tenantDefault | quote }}
            - name: DATABASE_URL
              value: {{ .Values.api.env.databaseUrl | default "postgresql://postgres:postgres@postgres.inference-platform.svc.cluster.local:5432/platform" | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.api.env.s3Endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.api.env.s3Region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.api.env.s3Bucket | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: SQS_ENDPOINT
              value: {{ .Values.api.env.sqsEndpoint | quote }}
            - name: SQS_REGION
              value: {{ .Values.api.env.sqsRegion | quote }}
            - name: SQS_QUEUE_URL
              value: {{ .Values.api.env.sqsQueueUrl | quote }}
            - name: SQS_DLQ_URL
              value: {{ .Values.api.env.sqsDlqUrl | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu | quote }}
              memory: {{ .Values.api.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu | quote }}
              memory: {{ .Values.api.resources.limits.memory | quote }}

