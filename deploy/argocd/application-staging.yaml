apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-platform-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: staging
    tier: control-plane-and-workers
spec:
  project: inference-platform
  source:
    repoURL: https://github.com/Santiagus/multi-tenant-AI-inference-platform.git
    targetRevision: main
    path: deploy/helm/inference-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: inference-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

