# Local integration stack only. Cloud uses ECS Fargate (API) + EKS/cloud workers — not this file.
# API image includes Python + PyTorch so REAL local inference works inside Compose.
#
# Quick start (CPU is enough for most paths):
#   docker compose up --build
#
# Local GPU (routing_preference=local/gpu → CUDA inside platform-api):
#   Host needs NVIDIA drivers (nvidia-smi) + NVIDIA Container Toolkit (Docker nvidia runtime).
#   One-time toolkit install on this Debian/Ubuntu Docker Engine host:
#     docker compose --profile gpu-setup run --rm nvidia-toolkit-install
#     sudo service docker restart
#     docker compose up -d --force-recreate api
#     docker exec platform-api python3 -c "import torch; print(torch.cuda.is_available())"
#   Without the toolkit, api.deploy device reservation fails start with:
#     could not select device driver "nvidia"
#
# Build-time toggles (API Dockerfile ARG / compose build.args):
#   INSTALL_CUDA_TORCH=1  CUDA-capable torch wheels (default; also runs on CPU)
#   INSTALL_CUDA_TORCH=0  smaller CPU-only wheels
#   INSTALL_HF_STACK=1    transformers/diffusers/etc for pretrained checkpoints (default; slow first build)
#   INSTALL_HF_STACK=0    skip HF stack for faster image builds (synthetic weights only)
# Pip wheels are kept in BuildKit cache mounts — after the first successful build,
# re-runs of the torch/HF steps are much faster unless those layers truly change.
#
# Runtime inference gates (api.environment — hardcoded so .env cannot silently mock):
#   MOCK_PROVIDERS=0           live local/cloud paths (dashboard can still flip mock)
#   FORCE_REAL_INFERENCE=1     require Python/PyTorch worker (needs torch in the image)
#   WORKER_ENABLED=true        background poller drains SQS automatically (recommended for local UI jobs)
services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: platform-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: elestio/minio:latest
    container_name: platform-minio
    user: "1000:1000"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # - minio_data:/data
      - ./data/minio:/data  # local bind mount
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq:latest
    container_name: platform-elasticmq
    restart: unless-stopped
    ports:
      - "9324:9324"
    volumes:
      - ./deploy/compose/elasticmq.conf:/opt/elasticmq.conf:ro
    environment:
      JAVA_OPTS: "-Dconfig.file=/opt/elasticmq.conf"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # 1 = CUDA-capable torch wheels (also run on CPU). 0 = smaller CPU-only wheels.
        INSTALL_CUDA_TORCH: ${INSTALL_CUDA_TORCH:-1}
        # 1 = transformers/diffusers for pretrained checkpoints (slow first build). 0 = faster image.
        INSTALL_HF_STACK: ${INSTALL_HF_STACK:-1}
    container_name: platform-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/platform
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: platform-artifacts
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_REGION: us-east-1
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/inference-jobs
      SQS_DLQ_URL: http://elasticmq:9324/000000000000/inference-jobs-dlq
      DEFAULT_TENANT_ID: tenant-default
      # Python worker invoked by the API for real inference (same container).
      PYTHON_BIN: python3
      PYTHONPATH: /app
      # Share host Hugging Face cache so Compose sees already-downloaded checkpoints.
      HF_HOME: /root/.cache/huggingface
      # See file header for MOCK_PROVIDERS / FORCE_REAL_INFERENCE / WORKER_ENABLED.
      MOCK_PROVIDERS: "0"
      FORCE_REAL_INFERENCE: "1"
      WORKER_ENABLED: "true"
      # Consumed by the NVIDIA Container Toolkit when api.deploy reserves a GPU.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      # Host HF hub cache (models--* under hub/). Override with HF_CACHE_HOST if needed.
      - ${HF_CACHE_HOST:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    # Pass host GPUs into platform-api for local/gpu (requires nvidia-toolkit-install once).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot host installer for NVIDIA Container Toolkit (profile: gpu-setup).
  # Does not install GPU drivers — only the Docker nvidia runtime. Drivers: host nvidia-smi.
  nvidia-toolkit-install:
    image: debian:bookworm-slim
    container_name: platform-nvidia-toolkit-install
    profiles: ["gpu-setup"]
    privileged: true
    pid: host
    network_mode: host
    ipc: host
    volumes:
      - ./deploy/compose/install-nvidia-container-toolkit.sh:/opt/platform/install-nvidia-container-toolkit.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq util-linux ca-certificates >/dev/null
        # Run installer in host namespaces so apt/docker config land on the Compose host.
        nsenter --target 1 --mount --uts --ipc --net --pid -- \
          bash -s < /opt/platform/install-nvidia-container-toolkit.sh
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    container_name: platform-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: platform-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - otel-collector

  grafana:
    image: grafana/grafana:11.1.0
    container_name: platform-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: platform-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
